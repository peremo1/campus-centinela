# -------------------------------------------------------------------
# Copia este archivo como "config.ini" y completa los datos.
# config.ini NO se sube al repositorio (está en .gitignore).
# -------------------------------------------------------------------
[credenciales]
# RUT del trabajador (el mismo que se usa para iniciar sesión).
# Formato: con guion y dígito verificador, por ejemplo 21080196-0
usuario = 21080196-0

# Contraseña de la cuenta.
contrasena = CAMBIAME

# RUT que va en la URL del certificado (certificado.php?...&rut=XXXX).
# Normalmente es el mismo que 'usuario'. Si lo dejas vacío, se usa 'usuario'.
rut =

# Tipo de documento en el login: false = NACIONAL (RUT), true = EXTRANJERO.
extranjero = false

[opciones]
# Carpeta donde se guardan los certificados y el Excel.
carpeta_salida = salida

# URL base de la plataforma (normalmente no hay que cambiarla).
url_base = https://www.campuscentinela.cl
